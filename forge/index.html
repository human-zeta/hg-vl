<style>
  :root{ --acid:#b8ff00; --glitch:#ff2d55; --cyan:#3ad0ff; --ink:#f0ede6; --line:rgba(240,237,230,.12); --bg:#050505; }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Space Mono',monospace;overflow:hidden;}

<script type="module">
import { Renderer } from 'https://esm.sh/interactive-shader-format';

const FAMILIES = ['KALEIDO','PLASMA','TÚNEL','VORONOI','ONDAS','FRACTAL','RAYMARCH','TRUCHET','MOIRÉ','HEX','ESPIRAL','METABALLS','KIFS','CAUSTICS','FLOW','MÁRMOL','CRISTAL','GRID','MICELIO','NEBULOSA','AURORA','MAGMA','RAYO','TINTA','CORAL','NEURONA','REACCIÓN','DENDRITA','LIQUEN','APOLONIO','CUASICRISTAL','FILOTAXIS','GIROIDE','HIPERESPACIO','CURL','TOPO','PINCELADA','SUPREMA','DRIP','COLLAGE','GARABATO','CHLADNI','ÓRBITA','CRESTA','BLOBS','PHASOR'];

// config de controles — de acá se generan panel, uniforms e ISF INPUTS
const BASE = [
  {k:'scale',   l:'escala',    min:0.5, max:6,   step:0.01},
  {k:'panx',    l:'pan X',     min:-3,  max:3,   step:0.01},
  {k:'pany',    l:'pan Y',     min:-3,  max:3,   step:0.01},
  {k:'rot',     l:'rotación',  min:0,   max:6.2832, step:0.01},
  {k:'sym',     l:'simetría',  min:0,   max:12,  step:1,   int:true},
  {k:'speed',   l:'velocidad', min:0,   max:2,   step:0.01},
  {k:'contrast',l:'contraste', min:0.4, max:2.5, step:0.01},
  {k:'cosfreq', l:'ciclos paleta', min:0.5, max:3, step:0.01},
];
// efectos con slider + toggle. Apagado => el uniform va en 0 y el shader lo saltea.
const FX = [
  {k:'warp',  l:'warp',        min:0, max:1.5, step:0.01},
  {k:'glitch',l:'glitch',      min:0, max:1,   step:0.01},
  {k:'aberr', l:'aberración',  min:0, max:1,   step:0.01},
  {k:'bloom', l:'bloom',       min:0, max:1.5, step:0.01},
  {k:'edge',  l:'contorno',    min:2, max:12,  step:0.01},
  {k:'post',  l:'posterizar',  min:2, max:12,  step:1,    int:true},
  {k:'pixel', l:'pixelar',     min:4, max:80,  step:1,    int:true},
  {k:'scan',  l:'scanlines',   min:0, max:1,   step:0.01},
  {k:'grain', l:'grano',       min:0, max:0.3, step:0.005},
  {k:'vig',   l:'viñeta',      min:0, max:1,   step:0.01},
  {k:'hue',   l:'hue shift',   min:0, max:1,   step:0.01},
  {k:'wave',  l:'ondular',     min:0, max:1,   step:0.01},
  {k:'rgbsh', l:'RGB shift',   min:0, max:1,   step:0.01},
  {k:'htone', l:'semitonos',   min:0, max:1,   step:0.01},
  {k:'dither',l:'dither',      min:0, max:1,   step:0.01},
];
// toggles puros (0/1)
const TOG = [
  {k:'mirror', l:'espejo'},
  {k:'invert', l:'invertir'},
  {k:'duo',    l:'duotono'},
  {k:'cosmic', l:'paleta cósmica'},
];
const FXMAX = { warp:1.5, glitch:1, aberr:1, bloom:1.5, edge:12, post:12, pixel:80, scan:1, grain:0.3, vig:1, hue:1, wave:1, rgbsh:1, htone:1, dither:1 };
// uniforms de audio 0..1: acá los llena el micrófono; en VDMX/Resolume el usuario
// mapea el análisis de audio del host (o un LFO) a estos sliders del .fs exportado.
// Modulación multiplicativa: un efecto apagado (0) sigue apagado.
const AUD = [
  {k:'aLow',  l:'audio graves → bloom'},
  {k:'aMid',  l:'audio medios → warp'},
  {k:'aHigh', l:'audio agudos → rgb'},
];

const SHADER_BODY = `
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 hash2(vec2 p){ return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x),mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x),u.y); }
float fbm(vec2 p){ float v=0.0,a=0.55; mat2 m=mat2(1.6,1.2,-1.2,1.6);
  for(int i=0;i<5;i++){ v+=a*vnoise(p); p=m*p; a*=0.5; } return v; }
float voro(vec2 p){ vec2 g=floor(p),f=fract(p); float f1=1.5,f2=1.5;
  for(int y=-1;y<=1;y++){ for(int x=-1;x<=1;x++){ vec2 o=vec2(float(x),float(y));
    vec2 r=o+hash2(g+o)-f; float d=dot(r,r);
    if(d<f1){ f2=f1; f1=d; } else if(d<f2){ f2=d; } } }
  return clamp((sqrt(f2)-sqrt(f1)), 0.0, 1.0); }
float julia(vec2 p, float t){ vec2 c=0.7*vec2(cos(t*0.3),sin(t*0.37)); vec2 z=p*0.55; float it=0.0;
  for(int i=0;i<28;i++){ z=vec2(z.x*z.x-z.y*z.y,2.0*z.x*z.y)+c; if(dot(z,z)>4.0)break; it+=1.0; } return it/28.0; }
float sdf3(vec3 q){ vec3 r=mod(q+1.0,2.0)-1.0; return length(r)-0.46; }
float raymarch(vec2 uv, float t){ vec3 ro=vec3(0.0,0.0,t*0.8); vec3 rd=normalize(vec3(uv,1.2));
  float glow=0.0, d=0.1;
  for(int i=0;i<28;i++){ float dist=sdf3(ro+rd*d); glow+=0.02/(abs(dist)+0.06); d+=max(abs(dist)*0.6,0.045); if(d>14.0)break; }
  return clamp(glow*0.13,0.0,1.0); }
float truchet(vec2 p, float t){ vec2 ip=floor(p),fp=fract(p); if(hash(ip)<0.5)fp.x=1.0-fp.x;
  float d=min(abs(length(fp)-0.5),abs(length(fp-1.0)-0.5)); return smoothstep(0.07+0.02*sin(t),0.0,d); }
float moire(vec2 p, float t){ float a=0.0; for(int i=0;i<3;i++){ float an=t*0.2+float(i)*1.047;
  vec2 q=mat2(cos(an),-sin(an),sin(an),cos(an))*p; a+=sin(q.x*6.0)*sin(q.y*6.0); } return 0.5+0.5*(a/3.0); }
float hexs(vec2 p, float t){ vec2 s=vec2(1.7320508,1.0); vec2 a=mod(p,s)-s*0.5; vec2 b=mod(p-s*0.5,s)-s*0.5;
  vec2 gv=dot(a,a)<dot(b,b)?a:b; vec2 id=p-gv; float ed=0.5-max(abs(gv.x)*0.866+abs(gv.y)*0.5,abs(gv.y));
  float c=hash(floor(id)+0.3); return smoothstep(0.0,0.07,ed)*(0.4+0.6*(0.5+0.5*sin(c*26.0+t*1.6))); }
float espiral(vec2 p, float t){ float a=atan(p.y,p.x); float r=length(p); return 0.5+0.5*sin(a*5.0+log(r+0.12)*6.0-t*2.0); }
float metaballs(vec2 p, float t){ float v=0.0; for(int i=0;i<5;i++){ float fi=float(i);
  vec2 c=1.3*vec2(sin(t*0.4+fi*1.7),cos(t*0.33+fi*2.3)); v+=0.33/(length(p-c)+0.05); } return smoothstep(1.5,3.6,v); }
float kifs(vec2 p, float t){ p*=1.2; float s=1.0,d=1e9; float ang=0.5+0.2*sin(t*0.3);
  mat2 R=mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
  for(int i=0;i<6;i++){ p=abs(p)-0.55; p=R*p; p*=1.35; s*=1.35; d=min(d,(length(p)-0.45)/s); } return smoothstep(0.07,0.0,abs(d)); }
float caustics(vec2 p, float t){ vec2 q=p; for(int i=0;i<4;i++){ float fi=float(i)+1.0;
  q+=0.5*vec2(sin(q.y*fi*1.3+t),cos(q.x*fi*1.1-t*0.8))/fi; } float c=abs(sin(q.x*2.0)*sin(q.y*2.0)); return pow(1.0-c,2.0); }
float flow(vec2 p, float t){ vec2 q=p; for(int i=0;i<3;i++){ q+=0.4*vec2(fbm(q+t*0.2),fbm(q.yx-t*0.15)); } return fbm(q*1.5); }
float marmol(vec2 p, float t){ float n=fbm(p*1.5+t*0.1); return 0.5+0.5*sin((p.x+p.y)*1.5+n*6.0); }
float cristal(vec2 p, float t){ vec2 g=floor(p),f=fract(p); float f1=1.5; vec2 mr=vec2(0.0);
  for(int y=-1;y<=1;y++){ for(int x=-1;x<=1;x++){ vec2 o=vec2(float(x),float(y));
    vec2 r=o+0.5+0.4*sin(t*0.5+6.2831*hash2(g+o))-f; float d=dot(r,r); if(d<f1){ f1=d; mr=r; } } } return 0.4+0.6*abs(mr.x+mr.y); }
float grid(vec2 uv, float t){ if(uv.y>-0.02) return 0.0; float persp=1.0/(-uv.y);
  float gx=abs(fract(uv.x*persp*0.5)-0.5); float gz=abs(fract(persp*0.6+t)-0.5);
  float line=max(smoothstep(0.04,0.0,gx),smoothstep(0.06,0.0,gz)); return line*smoothstep(0.0,-0.7,uv.y); }
float micelio(vec2 p, float t){ vec2 q=p; q+=0.6*vec2(fbm(p*1.3+t*0.15),fbm(p*1.3+vec2(3.1,1.7)-t*0.12));
  float n=fbm(q*1.6); float veins=pow(1.0-abs(2.0*n-1.0),3.0);
  float fine=1.0-abs(2.0*fbm(q*4.0+t*0.2)-1.0); float m=veins*0.85+pow(fine,4.0)*0.6;
  m*=0.65+0.35*sin(n*12.0-t*2.0); return clamp(m,0.0,1.0); }
float nebula(vec2 p, float t){ vec2 q=p*0.85; q+=vec2(fbm(q+t*0.05),fbm(q+vec2(2.0,5.0)-t*0.04));
  float gas=pow(fbm(q*1.5),2.0); vec2 sp=floor(p*9.0);
  float star=step(0.985,hash(sp))*pow(fract(hash(sp)*97.3),18.0); float tw=0.5+0.5*sin(t*3.0+hash(sp)*40.0);
  return clamp(gas*1.2+star*tw*4.0,0.0,1.0); }
float aurora(vec2 p, float t){ float bands=0.0;
  for(int i=0;i<4;i++){ float fi=float(i); float x=p.x*1.1+fbm(vec2(p.x*0.6,t*0.2+fi))*1.6;
    float curtain=fbm(vec2(x*0.8,p.y*0.5-t*0.3+fi*2.0)); float center=sin(x+fi*1.7)*0.45;
    bands+=smoothstep(0.35,0.7,curtain)*smoothstep(0.9,0.0,abs(p.y-center)); } return clamp(bands*0.7,0.0,1.0); }
float magma(vec2 p, float t){ vec2 q=p+0.3*vec2(fbm(p+t*0.1),fbm(p.yx-t*0.08));
  float crack=smoothstep(0.07,0.0,voro(q*1.4)); float ember=pow(fbm(p*3.0+t*0.35),3.0)*0.5;

  syncUI(); applyAll();
}

const r2=x=>Math.round(x*100)/100, r3=x=>Math.round(x*1000)/1000;

function isfHeader(withMode){

  AUD.forEach(a=>inputs.push({NAME:a.k,TYPE:'float',LABEL:a.l,DEFAULT:0,MIN:0,MAX:1}));

// Vista previa: familia FIJA en tiempo de compilación.

// por el PEOR caso: una familia barata (PLASMA) termina corriendo con la huella de

// runtime
const canvas=document.getElementById('gl');

// Techo de píxeles adaptativo. Arranca bajo y sube sólo si la máquina responde:
// el primer frame a resolución alta es justo el que cuelga a las GPU integradas.
let pxCap=0.7e6;
function resize(){
  if(innerWidth<2||innerHeight<2) return;   // tab oculta / viewport 0: no colapsar el canvas
  const dpr=Math.min(devicePixelRatio||1, 1.5);
  let w=innerWidth*dpr, h=innerHeight*dpr;
  const s=Math.sqrt(pxCap/(w*h));
  if(s<1){ w*=s; h*=s; }
  canvas.width=Math.max(1,Math.round(w)); canvas.height=Math.max(1,Math.round(h));
}

// ── ESTELA (echo/trails) ── la lib ISF no soporta buffers persistentes (PASSES),
// así que el feedback se hace componiendo en un canvas 2D: cada frame nuevo se
// dibuja con alpha (1-estela) sobre el acumulado => EMA visual = trails.
// Afecta preview y grabaciones; el .fs exportado no lo lleva (en VDMX usá el FX del host).
const fxc=document.getElementById('fx');
const fxctx=fxc.getContext('2d');
function compose(){
  if(P.estela<=0.001){ if(fxc.style.display) fxc.style.display=''; return; }
  if(fxc.width!==canvas.width||fxc.height!==canvas.height){ fxc.width=canvas.width; fxc.height=canvas.height; }
  if(!fxc.style.display||fxc.style.display==='') fxc.style.display='block';
  fxctx.globalAlpha=Math.max(0.05, 1-P.estela);
  fxctx.drawImage(canvas,0,0);
}
// fuente de captura (PNG/WebM): con estela activa lo que ves es el canvas 2D
const outCanvas=()=>P.estela>0.001? fxc : canvas;

// ── audio reactivo (micrófono) ──
// 3 bandas (graves/medios/agudos) con suavizado EMA y normalización adaptativa
// por pico corredizo. Modula los uniforms del lado JS: el shader y el .fs
// exportado NO cambian (en VDMX la reactividad la pone VDMX).
const mic = { on:false, ctx:null, analyser:null, buf:null, bands:[0,0,0], peak:[.1,.1,.1], amt:0.7, stream:null };
async function toggleMic(){
  if(mic.on){
    mic.on=false;
    if(mic.stream){ mic.stream.getTracks().forEach(t=>t.stop()); mic.stream=null; }
    if(mic.ctx){ mic.ctx.close().catch(()=>{}); mic.ctx=null; }
    document.getElementById('micBtn').classList.remove('on');
    document.getElementById('micBtn').textContent='🎤 MIC OFF';
    document.getElementById('micAmtWrap').style.display='none';
    applyAll(); return;
  }
  try{
    mic.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    mic.ctx = new (window.AudioContext||window.webkitAudioContext)();
    const src = mic.ctx.createMediaStreamSource(mic.stream);
    mic.analyser = mic.ctx.createAnalyser();
    mic.analyser.fftSize = 1024; mic.analyser.smoothingTimeConstant = 0.5;
    src.connect(mic.analyser);
    mic.buf = new Uint8Array(mic.analyser.frequencyBinCount);
    mic.on = true;
    document.getElementById('micBtn').classList.add('on');
    document.getElementById('micBtn').textContent='🎤 MIC ON';
    document.getElementById('micAmtWrap').style.display='';
    toast('audio reactivo activo — grave→bloom · medio→warp · agudo→rgb');
  }catch(e){ toast('no pude acceder al micrófono'); }
}
function micBands(){
  mic.analyser.getByteFrequencyData(mic.buf);
  const sr = mic.ctx.sampleRate, n = mic.buf.length, hzPerBin = (sr/2)/n;
  const ranges = [[30,250],[250,2000],[2000,8000]];
  for(let b=0;b<3;b++){
    const i0=Math.max(0,Math.floor(ranges[b][0]/hzPerBin)), i1=Math.min(n-1,Math.ceil(ranges[b][1]/hzPerBin));
    let s=0; for(let i=i0;i<=i1;i++) s+=mic.buf[i];
    const raw=(s/(i1-i0+1))/255;
    mic.peak[b]=Math.max(raw, mic.peak[b]*0.995, 0.08);          // pico corredizo con decaimiento
    const norm=Math.min(1, raw/mic.peak[b]);
    mic.bands[b]+= (norm-mic.bands[b])*0.35;                     // EMA de ataque rápido
  }
}
function micModulate(){
  micBands();
  const [lo,mi,hi]=mic.bands, k=mic.amt;
  // alimenta los mismos uniforms aLow/aMid/aHigh que en VDMX llena el host
  renderer.setValue('aLow',  Math.min(1, lo*k));
  renderer.setValue('aMid',  Math.min(1, mi*k));
  renderer.setValue('aHigh', Math.min(1, hi*k));
}

// Tope de FPS + vigilancia: si los frames se vuelven lentos, baja la resolución en
// vez de arrastrar al navegador a un cuelgue.
const FPS=30; let last=0, ema=0, offline=false;
function frame(now){
  requestAnimationFrame(frame);
  if(offline) return;              // el export mp4 offline maneja sus propios draws
  if(now-last < 1000/FPS - 1) return;
  const dt = last ? now-last : 1000/FPS; last=now;
  ema = ema ? ema*0.85+dt*0.15 : dt;
  if(ema > (1000/FPS)*2.2 && pxCap > 0.15e6){
    pxCap=Math.max(0.15e6, pxCap*0.7); ema=0; resize();
    console.warn('[forge] bajando resolución a '+Math.round(pxCap/1000)+'k px');
  } else if(ema < (1000/FPS)*1.15 && pxCap < 2.0e6){
    pxCap=Math.min(2.0e6, pxCap*1.05); resize();
  }
  if(mic.on && mic.analyser) micModulate();
  try{ renderer.draw(canvas); }catch(e){}
  compose();
}
requestAnimationFrame(frame);

function applyAll(){
  syncSource();
  BASE.forEach(b=>renderer.setValue(b.k,P[b.k]));
  FX.forEach(f=>renderer.setValue(f.k, fxVal(f.k)));
  TOG.forEach(tg=>renderer.setValue(tg.k, P.tog[tg.k]?1:0));
  AUD.forEach(a=>renderer.setValue(a.k, 0));
  renderer.setValue('colA',P.colA.concat(1)); renderer.setValue('colB',P.colB.concat(1)); renderer.setValue('colC',P.colC.concat(1));
  updateHash();
}

// color helpers
function hsl(h,s,l){ h=((h%1)+1)%1; const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h*12)%12; return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));};
  return [f(0),f(8),f(4)]; }
function toHex(c){ return '#'+c.map(x=>('0'+Math.round(Math.max(0,Math.min(1,x))*255).toString(16)).slice(-2)).join(''); }
function fromHex(h){ return [parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255]; }

// GENERAR — recipe aleatoria con buen gusto: familia + stack de efectos con un "look" fuerte ocasional.
// Sembrada: roll(123456) reproduce EXACTAMENTE la misma receta en cualquier máquina.
function roll(fixedSeed){
  seed = Number.isFinite(fixedSeed) ? Math.abs(Math.floor(fixedSeed))%1e9 : Math.floor(Math.random()*1e6);
  rnd = seedRng(seed);
  P.mode = Math.floor(rnd()*FAMILIES.length);
  P.scale = 1.8 + rnd()*3.0;
  P.sym = rnd()<0.6 ? 0 : (3+Math.floor(rnd()*8));   // más seguido sin kaleido → menos simétrico
  P.rot = rnd()<0.5 ? 0 : rnd()*6.2832;
  P.panx = rnd()<0.4 ? 0 : (rnd()*4-2);              // descentra la composición
  P.pany = rnd()<0.4 ? 0 : (rnd()*4-2);
  P.speed = 0.2 + rnd()*0.9;
  P.contrast = 0.85 + rnd()*0.9;
  const A=P.amt;
  A.warp=0.15+rnd()*rnd()*1.2; A.glitch=0.1+rnd()*0.5; A.aberr=0.1+rnd()*0.6;
  A.bloom=0.2+rnd()*0.9; A.edge=3+rnd()*7; A.post=3+Math.floor(rnd()*7);
  A.pixel=8+Math.floor(rnd()*50); A.scan=0.15+rnd()*0.5; A.grain=0.02+rnd()*0.1;
  A.vig=0.35+rnd()*0.55; A.hue=rnd();
  A.wave=0.15+rnd()*0.5; A.rgbsh=0.15+rnd()*0.5; A.htone=0.4+rnd()*0.5; A.dither=0.3+rnd()*0.5;
  const O=P.on;
  O.warp=rnd()<0.8; O.aberr=rnd()<0.55; O.bloom=rnd()<0.7;
  O.grain=rnd()<0.65; O.vig=rnd()<0.85; O.glitch=rnd()<0.3;
  O.scan=rnd()<0.22; O.hue=rnd()<0.3;
  O.wave=rnd()<0.25; O.rgbsh=rnd()<0.3; O.dither=rnd()<0.2;
  // "look" fuerte: como mucho uno (contorno/posterizar/pixelar/semitonos) para que lea como tratamiento distinto
  O.edge=false; O.post=false; O.pixel=false; O.htone=false;
  const looks=['none','none','edge','post','pixel','htone']; const pick=looks[Math.floor(rnd()*looks.length)];
  if(pick!=='none') O[pick]=true;
  P.tog.mirror=rnd()<0.3; P.tog.invert=rnd()<0.18; P.tog.duo=rnd()<0.3;
  P.tog.cosmic=rnd()<0.35; P.cosfreq=[0.5,1,1,1.5,2][Math.floor(rnd()*5)];
  const h0=rnd(), schemes=[0.5,0.33,-0.33,0.08,0.14], h1=(h0+schemes[Math.floor(rnd()*schemes.length)]+1)%1;
  P.colA = hsl(h0, 0.45+rnd()*0.3, 0.03+rnd()*0.05);
  P.colB = hsl(h0, 0.8+rnd()*0.2, 0.5+rnd()*0.12);
  P.colC = hsl(h1, 0.85+rnd()*0.15, 0.55+rnd()*0.15);
  syncUI(); applyAll(); pushHist();
}

// RE-ENCUADRE — re-tira solo el encuadre (pan/rotación/escala/simetría), misma familia y efectos
function rollFraming(){
  P.scale=1.5+Math.random()*3.5;
  P.rot=Math.random()<0.4?0:Math.random()*6.2832;
  P.panx=Math.random()<0.3?0:(Math.random()*5-2.5);
  P.pany=Math.random()<0.3?0:(Math.random()*5-2.5);
  P.sym=Math.random()<0.7?0:(3+Math.floor(Math.random()*8));
  syncUI(); applyAll(); pushHist();
}

// PALETA — re-tira solo los 3 colores, mismo patrón y efectos
function rollPalette(){
  const h0=Math.random(), schemes=[0.5,0.33,-0.33,0.08,0.14], h1=(h0+schemes[Math.floor(Math.random()*schemes.length)]+1)%1;
  P.colA = hsl(h0, 0.45+Math.random()*0.3, 0.03+Math.random()*0.05);
  P.colB = hsl(h0, 0.8+Math.random()*0.2, 0.5+Math.random()*0.12);
  P.colC = hsl(h1, 0.85+Math.random()*0.15, 0.55+Math.random()*0.15);
  syncUI(); applyAll(); pushHist();
}

// Chrome no escribe Duration en los WebM de MediaRecorder → archivo no seekeable
// en Premiere/AE. Patch EBML: agrega Duration en Segment→Info si es seguro hacerlo.
// (re-implementación propia de la técnica del paquete MIT fix-webm-duration)
async function fixWebmDuration(blob, durationMs){
  try{
    const u8=new Uint8Array(await blob.arrayBuffer()); let pos=0;
    const rv=(keep)=>{ if(pos>=u8.length)return null; const f=u8[pos]; if(!f)return null;
      let len=1; for(let m=0x80;!(f&m);m>>=1)len++;
      if(len>8||pos+len>u8.length)return null;
      let val=keep?f:f&(0xFF>>len); let ones=!keep&&val===(0xFF>>len);
      for(let i=1;i<len;i++){ val=val*256+u8[pos+i]; if(u8[pos+i]!==0xFF)ones=false; }
      pos+=len; return {val,len,unknown:ones&&!keep}; };
    let segC=-1, segUnk=false;
    while(pos<u8.length){ const id=rv(true); if(!id)return blob; const sz=rv(false); if(!sz)return blob;
      if(id.val===0x18538067){ segC=pos; segUnk=sz.unknown; break; } pos+=sz.val; }
    if(segC<0||!segUnk) return blob;
    pos=segC; let infoId=-1, infoC=-1, infoSz=0;
    while(pos<u8.length){ const ip=pos; const id=rv(true); if(!id)return blob;
      const sz=rv(false); if(!sz||sz.unknown)return blob;
      if(id.val===0x114D9B74||id.val===0x1F43B675) return blob;
      if(id.val===0x1549A966){ infoId=ip; infoC=pos; infoSz=sz.val; break; } pos+=sz.val; }
    if(infoC<0) return blob;
    pos=infoC; let scale=1e6;
    while(pos<infoC+infoSz){ const id=rv(true); if(!id)return blob; const sz=rv(false); if(!sz)return blob;
      if(id.val===0x4489) return blob;
      if(id.val===0x2AD7B1){ let v=0; for(let i=0;i<sz.val;i++)v=v*256+u8[pos+i]; if(v)scale=v; } pos+=sz.val; }
    const dur=new Uint8Array(11); dur[0]=0x44; dur[1]=0x89; dur[2]=0x88;
    new DataView(dur.buffer).setFloat64(3, durationMs*1e6/scale);
    const ns=infoSz+11, sv=new Uint8Array(8); sv[0]=0x01;
    for(let i=7,v=ns;i>=1;i--){ sv[i]=v&0xFF; v=Math.floor(v/256); }
    return new Blob([u8.slice(0,infoId+4),sv,u8.slice(infoC,infoC+infoSz),dur,u8.slice(infoC+infoSz)],{type:blob.type||'video/webm'});
  }catch(e){ return blob; }
}

  try{ renderer.draw(canvas); }catch(e){}
  canvas.toBlob(b=>{ if(b){ dl(b, slug()+'.png'); toast('PNG descargado'); } else toast('no se pudo capturar');
    pxCap=old; resize(); },'image/png');
});

// WEBM: graba el canvas en vivo N segundos (vp9 → vp8 → default como fallback)
let rec=null;
document.getElementById('recBtn').addEventListener('click',()=>{
  const btn=document.getElementById('recBtn');
  if(rec){ rec.stop(); return; }
  const secs=+document.getElementById('recDur').value||10;
  const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const stream=outCanvas().captureStream(FPS);
  const chunks=[];
  try{ rec=new MediaRecorder(stream,{mimeType:mime||undefined,videoBitsPerSecond:12e6}); }
  catch(e){ toast('tu navegador no puede grabar el canvas'); return; }
  rec.ondataavailable=e=>{ if(e.data.size)chunks.push(e.data); };
  // rAF se congela con la tab oculta: driver propio para que la grabación siga
  // aunque el usuario se vaya a otra pestaña mientras graba
  const drv=setInterval(()=>{ if(document.hidden){ if(mic.on&&mic.analyser)micModulate(); try{ renderer.draw(canvas); }catch(e){} compose(); } },1000/FPS);
  const t0=performance.now();
  rec.onstop=async()=>{ clearInterval(drv);
    const fixed=await fixWebmDuration(new Blob(chunks,{type:'video/webm'}), performance.now()-t0);
    dl(fixed, slug()+'.webm'); toast('WebM descargado');
    btn.classList.remove('rec'); btn.textContent='⏺ WEBM'; rec=null; stream.getTracks().forEach(t=>t.stop()); };
  rec.start(1000);
  btn.classList.add('rec'); btn.textContent='⏹ '+secs+'s';
  let left=secs; const iv=setInterval(()=>{ left--; if(!rec||left<=0){ clearInterval(iv); if(rec)rec.stop(); } else btn.textContent='⏹ '+left+'s'; },1000);
});

// ── MP4 LOOP PERFECTO — render offline determinista (WebCodecs + mp4-muxer, MIT) ──
// El reloj del renderer se controla frame a frame (startTime = Date.now() - t·1000),
// así que cada frame sale en su timestamp exacto: sin drops y más rápido que tiempo
// real. El loop cierra sin salto por crossfade de fase corrida: los últimos K frames
// funden el arranque del ciclo siguiente sobre la cola — el archivo repite idéntico.
let mp4Busy=false;
document.getElementById('mp4Btn').addEventListener('click',async()=>{
  const btn=document.getElementById('mp4Btn');
  if(mp4Busy) return;
  if(!('VideoEncoder' in window)){ toast('tu navegador no soporta WebCodecs (probá Chrome/Edge)'); return; }
  let MX; try{ MX=await import('https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm'); }
  catch(e){ toast('no pude cargar el muxer (¿sin conexión?)'); return; }
  mp4Busy=true; offline=true; btn.textContent='◇ render 0%';
  const secs=+document.getElementById('recDur').value||10, fps=FPS;
  const N=Math.round(secs*fps), K=Math.min(Math.floor(N/2), fps);   // crossfade de 1 s
  const oldCap=pxCap, oldStart=renderer.startTime;
  try{
    pxCap=2.07e6; resize();                                          // ~1080p al aspecto del viewport
    const W=canvas.width&~1, H=canvas.height&~1;
    const ex=document.createElement('canvas'); ex.width=W; ex.height=H;
    const exx=ex.getContext('2d');
    const acc=document.createElement('canvas'); acc.width=W; acc.height=H;   // acumulador de estela
    const accx=acc.getContext('2d');
    const T0=1000;
    const drawAt=t=>{ renderer.startTime=Date.now()-t*1000; renderer.draw(canvas); };
    // un frame de salida j (con fase corrida K) compuesto en `ex`
    const composeOut=j=>{
      exx.globalAlpha=1;
      if(j<N-K){ drawAt(T0+(j+K)/fps); exx.drawImage(canvas,0,0,W,H); }
      else{ const i=j+K-N;                                           // zona de crossfade
        drawAt(T0+(i+N)/fps); exx.drawImage(canvas,0,0,W,H);
        drawAt(T0+i/fps); exx.globalAlpha=i/K; exx.drawImage(canvas,0,0,W,H); exx.globalAlpha=1; }
      if(P.estela>0.001){ accx.globalAlpha=Math.max(0.05,1-P.estela); accx.drawImage(ex,0,0); return acc; }
      return ex;
    };
    let codec=null;
    for(const c of ['avc1.640028','avc1.42002a','avc1.42001f']){
      const s=await VideoEncoder.isConfigSupported({codec:c,width:W,height:H,bitrate:12e6,framerate:fps});
      if(s.supported){ codec=c; break; }
    }
    if(!codec) throw new Error('sin codec H.264 disponible');
    const muxer=new MX.Muxer({ target:new MX.ArrayBufferTarget(), video:{codec:'avc',width:W,height:H}, fastStart:'in-memory' });
    let encErr=null;
    const enc=new VideoEncoder({ output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta), error:e=>{ encErr=e; } });
    enc.configure({codec,width:W,height:H,bitrate:12e6,framerate:fps});
    // con estela: pre-rodar la cola para que el acumulado ya tenga historia al frame 0
    if(P.estela>0.001){ const pre=Math.min(N, fps*2);
      for(let j=N-pre;j<N;j++) composeOut(j); }
    for(let j=0;j<N;j++){
      if(encErr) throw encErr;
      const src=composeOut(j);
      const vf=new VideoFrame(src,{timestamp:Math.round(j*1e6/fps), duration:Math.round(1e6/fps)});
      enc.encode(vf,{keyFrame: j%(fps*2)===0}); vf.close();
      // yield vía MessageChannel: setTimeout se estrangula a 1 s en tabs ocultas
      const yieldTask=()=>new Promise(res2=>{ const ch=new MessageChannel(); ch.port1.onmessage=()=>res2(); ch.port2.postMessage(0); });
      while(enc.encodeQueueSize>6) await yieldTask();
      if(j%15===0){ btn.textContent='◇ render '+Math.round(j/N*100)+'%'; await yieldTask(); }
    }
    await enc.flush(); muxer.finalize();
    dl(new Blob([muxer.target.buffer],{type:'video/mp4'}), slug()+'-loop.mp4');
    toast('mp4 con loop perfecto descargado');
  }catch(e){ console.error(e); toast('falló el mp4: '+(e&&e.message||e)); }
  finally{ renderer.startTime=oldStart; pxCap=oldCap; resize(); offline=false; mp4Busy=false; btn.textContent='◇ MP4 LOOP PERFECTO'; }
});

// LINK: la receta entera viaja en la URL
document.getElementById('linkBtn').addEventListener('click',async()=>{
  updateHash(); clearTimeout(hashT);
  const url=location.origin+location.pathname+'#p='+btoa(JSON.stringify(snapState()));
  try{ await navigator.clipboard.writeText(url); toast('link copiado — abrilo en cualquier lado'); }
  catch(e){ toast('no se pudo copiar el link'); }
});

// presets con nombre (localStorage)
const PRESET_KEY='hg_forge_presets_v1';
const loadPresets=()=>{ try{ return JSON.parse(localStorage.getItem(PRESET_KEY))||{}; }catch(e){ return {}; } };
function renderPresets(sel){
  const ps=loadPresets(), el=document.getElementById('presetSel');
  el.innerHTML='<option value="">— presets —</option>'+Object.keys(ps).sort().map(n=>`<option${n===sel?' selected':''}>${n.replace(/</g,'&lt;')}</option>`).join('');
}
document.getElementById('presetSave').addEventListener('click',()=>{
  const name=prompt('nombre del preset:', FAMILIES[P.mode].toLowerCase()+' '+seed); if(!name)return;
  const ps=loadPresets(); ps[name]=snapState(); localStorage.setItem(PRESET_KEY,JSON.stringify(ps));
  renderPresets(name); toast('preset guardado: '+name);
});
document.getElementById('presetDel').addEventListener('click',()=>{
  const el=document.getElementById('presetSel'); if(!el.value)return;
  const ps=loadPresets(); delete ps[el.value]; localStorage.setItem(PRESET_KEY,JSON.stringify(ps));
  renderPresets(); toast('preset borrado');
});
document.getElementById('presetSel').addEventListener('change',e=>{
  const ps=loadPresets(); if(ps[e.target.value]){ loadState(ps[e.target.value]); pushHist(); toast('preset cargado'); }
});

// puente FORGE → PULSO: el .fs viaja por localStorage (same-origin), PULSO lo
// levanta con ?from=forge y te deja mapear graves/medios/agudos a los INPUTS
document.getElementById('pulsoBtn').addEventListener('click',()=>{
  try{ localStorage.setItem('hg_pulso_handoff', isfSource()); window.open('/pulso/?from=forge','_blank'); }
  catch(e){ toast('no se pudo pasar el shader'); }
});

document.getElementById('estela').addEventListener('input',e=>{ P.estela=+e.target.value; document.getElementById('estelaV').textContent=P.estela.toFixed(2); updateHash(); });
document.getElementById('micBtn').addEventListener('click',toggleMic);
document.getElementById('micAmt').addEventListener('input',e=>{ mic.amt=+e.target.value; document.getElementById('micAmtV').textContent=mic.amt.toFixed(2); });
document.getElementById('micAmtV').textContent=mic.amt.toFixed(2);

// semilla editable: click → entrás un número → misma receta en cualquier máquina
document.getElementById('seedline').addEventListener('click',()=>{
  const v=prompt('semilla (número) — la misma semilla genera la misma receta:', seed);
  if(v===null)return; const n=parseInt(v,10);
  if(Number.isFinite(n)) roll(n); else toast('semilla inválida');
});

document.getElementById('toggle').addEventListener('click',()=>document.getElementById('panel').classList.toggle('hide'));
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return; const k=e.key.toLowerCase();
  if(k==='g')roll(); if(k==='r')rollFraming(); if(k==='p')rollPalette();
  if(k==='s')document.getElementById('exportBtn').click();
  if(k==='f'){ if(document.fullscreenElement)document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }
  if(k==='h')document.body.classList.toggle('zen');
  if(e.key==='ArrowLeft')histGo(-1); if(e.key==='ArrowRight')histGo(1); });

renderPresets();
if(!readHash()){ syncUI(); applyAll(); }
pushHist();
